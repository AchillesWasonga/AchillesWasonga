<svg width="340" height="36" viewBox="0 0 340 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes cycle {
        0%,  18% { opacity: 1; }
        22%, 48% { opacity: 0; }
        52%, 68% { opacity: 0; }
        72%, 98% { opacity: 0; }
        100%      { opacity: 1; }
      }
      @keyframes cycle2 {
        0%,  18% { opacity: 0; }
        22%, 48% { opacity: 1; }
        52%, 68% { opacity: 0; }
        72%, 98% { opacity: 0; }
        100%      { opacity: 0; }
      }
      @keyframes cycle3 {
        0%,  18% { opacity: 0; }
        22%, 48% { opacity: 0; }
        52%, 68% { opacity: 1; }
        72%, 98% { opacity: 0; }
        100%      { opacity: 0; }
      }
      @keyframes cycle4 {
        0%,  18% { opacity: 0; }
        22%, 48% { opacity: 0; }
        52%, 68% { opacity: 0; }
        72%, 98% { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes blink-warn {
        0%, 49% { opacity: 1; }
        50%,100% { opacity: 0.2; }
      }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .label { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #3a6a8a; }
      .s1 { animation: cycle  8s step-end infinite; }
      .s2 { animation: cycle2 8s step-end infinite; }
      .s3 { animation: cycle3 8s step-end infinite; }
      .s4 { animation: cycle4 8s step-end infinite; }
      .blink { animation: blink-warn 0.8s step-end infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="340" height="36" rx="4" fill="#050818"/>
  <rect width="340" height="36" rx="4" fill="none" stroke="#0d2a40" stroke-width="1"/>

  <!-- static label -->
  <text x="12" y="23" class="label">THREAT_LEVEL ::</text>

  <!-- LOW -->
  <g class="s1" filter="url(#glow)">
    <rect x="132" y="8" width="54" height="20" rx="3" fill="#050818" stroke="#39ff14" stroke-width="1"/>
    <text x="159" y="22" text-anchor="middle" class="mono" fill="#39ff14">[ LOW ]</text>
  </g>

  <!-- MEDIUM -->
  <g class="s2" filter="url(#glow)">
    <rect x="122" y="8" width="76" height="20" rx="3" fill="#050818" stroke="#ffbd2e" stroke-width="1"/>
    <text x="160" y="22" text-anchor="middle" class="mono" fill="#ffbd2e">[ MEDIUM ]</text>
  </g>

  <!-- HIGH -->
  <g class="s3" filter="url(#glow)">
    <rect x="132" y="8" width="56" height="20" rx="3" fill="#050818" stroke="#ff6b35" stroke-width="1"/>
    <text x="160" y="22" text-anchor="middle" class="mono" fill="#ff6b35">[ HIGH ]</text>
  </g>

  <!-- CRITICAL — blinks -->
  <g class="s4" filter="url(#glow)">
    <rect x="118" y="8" width="84" height="20" rx="3" fill="#050818" stroke="#ff2222" stroke-width="1" class="blink"/>
    <text x="160" y="22" text-anchor="middle" class="mono" fill="#ff2222" class="blink">[ CRITICAL ]</text>
  </g>

  <!-- right side bars (signal strength style) -->
  <rect x="224" y="20" width="5" height="8"  rx="1" fill="#0d2a40"/>
  <rect x="232" y="16" width="5" height="12" rx="1" fill="#0d2a40"/>
  <rect x="240" y="12" width="5" height="16" rx="1" fill="#0d2a40"/>
  <rect x="248" y="8"  width="5" height="20" rx="1" fill="#0d2a40"/>

  <!-- animated fill based on level -->
  <g class="s1">
    <rect x="224" y="20" width="5" height="8"  rx="1" fill="#39ff14"/>
  </g>
  <g class="s2">
    <rect x="224" y="20" width="5" height="8"  rx="1" fill="#ffbd2e"/>
    <rect x="232" y="16" width="5" height="12" rx="1" fill="#ffbd2e"/>
  </g>
  <g class="s3">
    <rect x="224" y="20" width="5" height="8"  rx="1" fill="#ff6b35"/>
    <rect x="232" y="16" width="5" height="12" rx="1" fill="#ff6b35"/>
    <rect x="240" y="12" width="5" height="16" rx="1" fill="#ff6b35"/>
  </g>
  <g class="s4 blink">
    <rect x="224" y="20" width="5" height="8"  rx="1" fill="#ff2222"/>
    <rect x="232" y="16" width="5" height="12" rx="1" fill="#ff2222"/>
    <rect x="240" y="12" width="5" height="16" rx="1" fill="#ff2222"/>
    <rect x="248" y="8"  width="5" height="20" rx="1" fill="#ff2222"/>
  </g>

  <!-- uptime -->
  <text x="270" y="15" class="label">UPTIME</text>
  <text x="270" y="27" class="mono" fill="#7ad9ff" font-size="10" font-family="JetBrains Mono, monospace">99.97%</text>
</svg>
