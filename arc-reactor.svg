<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#cfeeff" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#0066aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#001a33" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="outerMetal" cx="50%" cy="50%" r="55%">
      <stop offset="78%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#070710"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style><![CDATA[
      @keyframes pulse {
        0%, 100% { opacity: 0.92; }
        50%      { opacity: 1; }
      }
      @keyframes spin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
      }
      .core           { animation: pulse 2.6s ease-in-out infinite; transform-origin: 100px 100px; }
      .capacitor-ring { animation: spin 30s linear infinite;        transform-origin: 100px 100px; }
    ]]></style>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#outerMetal)" stroke="#3a3a48" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="80" fill="#050510" stroke="#1a1a25" stroke-width="1"/>

  <g class="capacitor-ring">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#4a90b8" stroke-width="0.5" stroke-opacity="0.5"/>
    <g fill="#7ad9ff" opacity="0.85">
      <circle cx="100"   cy="30"    r="2.6"/>
      <circle cx="135"   cy="39.4"  r="2.6"/>
      <circle cx="160.6" cy="65"    r="2.6"/>
      <circle cx="170"   cy="100"   r="2.6"/>
      <circle cx="160.6" cy="135"   r="2.6"/>
      <circle cx="135"   cy="160.6" r="2.6"/>
      <circle cx="100"   cy="170"   r="2.6"/>
      <circle cx="65"    cy="160.6" r="2.6"/>
      <circle cx="39.4"  cy="135"   r="2.6"/>
      <circle cx="30"    cy="100"   r="2.6"/>
      <circle cx="39.4"  cy="65"    r="2.6"/>
      <circle cx="65"    cy="39.4"  r="2.6"/>
    </g>
  </g>

  <g class="core">
    <circle cx="100" cy="100" r="58" fill="url(#coreGlow)" filter="url(#softGlow)"/>
    <polygon points="100,66 130,120 70,120"
             fill="none"
             stroke="#ffffff"
             stroke-width="1.6"
             stroke-opacity="0.92"
             filter="url(#softGlow)"/>
    <circle cx="100" cy="100" r="7" fill="#ffffff" opacity="0.96"/>
  </g>
</svg>
