<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes scanline {
        0%   { transform: translateY(-100%); }
        100% { transform: translateY(800%); }
      }
      @keyframes glitch1 {
        0%,94%,100% { clip-path: none; transform: none; opacity:1; }
        95% { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translateX(-3px); opacity:0.8; }
        97% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translateX(3px); opacity:0.8; }
      }
      @keyframes flicker {
        0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
        20%,24%,55% { opacity: 0.4; }
      }
      .terminal-bg   { fill: #050810; }
      .screen        { fill: #050e1a; rx: 6; }
      .title-bar     { fill: #0d1b2a; }
      .dot-red       { fill: #ff5f57; }
      .dot-yellow    { fill: #ffbd2e; }
      .dot-green     { fill: #28c840; }
      .prompt        { fill: #00d4ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cmd           { fill: #e0f4ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .output-key    { fill: #7ad9ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-val    { fill: #c8f0ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-dim    { fill: #3a6a8a; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-warn   { fill: #ff6b35; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-green  { fill: #39ff14; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .cursor        { fill: #00d4ff; animation: blink 1s step-end infinite; }
      .scanline      { fill: none; stroke: #7ad9ff; stroke-width: 0.3; stroke-opacity: 0.04; }
      .glitch        { animation: glitch1 8s infinite; }
      .screen-flicker { animation: flicker 12s infinite; }
    </style>

    <filter id="crt" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="screen" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncR type="linear" slope="0.97"/>
        <feFuncG type="linear" slope="0.97"/>
        <feFuncB type="linear" slope="1.0"/>
      </feComponentTransfer>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050e1a"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="20" y="44" width="760" height="336" rx="4"/>
    </clipPath>
  </defs>

  <!-- Outer shell -->
  <rect width="800" height="400" rx="10" class="terminal-bg"/>
  <rect x="1" y="1" width="798" height="398" rx="10" fill="none" stroke="#0d2a40" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="44" rx="10" class="title-bar"/>
  <rect x="0" y="24" width="800" height="20" class="title-bar"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="22" r="7" class="dot-red"/>
  <circle cx="52" cy="22" r="7" class="dot-yellow"/>
  <circle cx="76" cy="22" r="7" class="dot-green"/>

  <!-- Title -->
  <text x="400" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3a6a8a">webstyr@station-7 — bash — 800×400</text>

  <!-- Screen background -->
  <rect x="20" y="44" width="760" height="336" rx="4" fill="url(#screenGrad)"/>

  <!-- Scanlines -->
  <g clip-path="url(#screenClip)">
    <line x1="20" y1="50"  x2="780" y2="50"  class="scanline"/>
    <line x1="20" y1="54"  x2="780" y2="54"  class="scanline"/>
    <line x1="20" y1="58"  x2="780" y2="58"  class="scanline"/>
    <line x1="20" y1="62"  x2="780" y2="62"  class="scanline"/>
    <line x1="20" y1="66"  x2="780" y2="66"  class="scanline"/>
    <line x1="20" y1="70"  x2="780" y2="70"  class="scanline"/>
    <line x1="20" y1="74"  x2="780" y2="74"  class="scanline"/>
    <line x1="20" y1="78"  x2="780" y2="78"  class="scanline"/>
    <line x1="20" y1="82"  x2="780" y2="82"  class="scanline"/>
    <line x1="20" y1="86"  x2="780" y2="86"  class="scanline"/>
    <line x1="20" y1="90"  x2="780" y2="90"  class="scanline"/>
    <line x1="20" y1="94"  x2="780" y2="94"  class="scanline"/>
    <line x1="20" y1="98"  x2="780" y2="98"  class="scanline"/>
    <line x1="20" y1="102" x2="780" y2="102" class="scanline"/>
    <line x1="20" y1="106" x2="780" y2="106" class="scanline"/>
    <line x1="20" y1="110" x2="780" y2="110" class="scanline"/>
    <line x1="20" y1="114" x2="780" y2="114" class="scanline"/>
    <line x1="20" y1="118" x2="780" y2="118" class="scanline"/>
    <line x1="20" y1="122" x2="780" y2="122" class="scanline"/>
    <line x1="20" y1="126" x2="780" y2="126" class="scanline"/>
    <line x1="20" y1="130" x2="780" y2="130" class="scanline"/>
    <line x1="20" y1="134" x2="780" y2="134" class="scanline"/>
    <line x1="20" y1="138" x2="780" y2="138" class="scanline"/>
    <line x1="20" y1="142" x2="780" y2="142" class="scanline"/>
    <line x1="20" y1="146" x2="780" y2="146" class="scanline"/>
    <line x1="20" y1="150" x2="780" y2="150" class="scanline"/>
    <line x1="20" y1="154" x2="780" y2="154" class="scanline"/>
    <line x1="20" y1="158" x2="780" y2="158" class="scanline"/>
    <line x1="20" y1="162" x2="780" y2="162" class="scanline"/>
    <line x1="20" y1="166" x2="780" y2="166" class="scanline"/>
    <line x1="20" y1="170" x2="780" y2="170" class="scanline"/>
    <line x1="20" y1="174" x2="780" y2="174" class="scanline"/>
    <line x1="20" y1="178" x2="780" y2="178" class="scanline"/>
    <line x1="20" y1="182" x2="780" y2="182" class="scanline"/>
    <line x1="20" y1="186" x2="780" y2="186" class="scanline"/>
    <line x1="20" y1="190" x2="780" y2="190" class="scanline"/>
    <line x1="20" y1="194" x2="780" y2="194" class="scanline"/>
    <line x1="20" y1="198" x2="780" y2="198" class="scanline"/>
    <line x1="20" y1="202" x2="780" y2="202" class="scanline"/>
    <line x1="20" y1="206" x2="780" y2="206" class="scanline"/>
    <line x1="20" y1="210" x2="780" y2="210" class="scanline"/>
    <line x1="20" y1="214" x2="780" y2="214" class="scanline"/>
    <line x1="20" y1="218" x2="780" y2="218" class="scanline"/>
    <line x1="20" y1="222" x2="780" y2="222" class="scanline"/>
    <line x1="20" y1="226" x2="780" y2="226" class="scanline"/>
    <line x1="20" y1="230" x2="780" y2="230" class="scanline"/>
    <line x1="20" y1="234" x2="780" y2="234" class="scanline"/>
    <line x1="20" y1="238" x2="780" y2="238" class="scanline"/>
    <line x1="20" y1="242" x2="780" y2="242" class="scanline"/>
    <line x1="20" y1="246" x2="780" y2="246" class="scanline"/>
    <line x1="20" y1="250" x2="780" y2="250" class="scanline"/>
    <line x1="20" y1="254" x2="780" y2="254" class="scanline"/>
    <line x1="20" y1="258" x2="780" y2="258" class="scanline"/>
    <line x1="20" y1="262" x2="780" y2="262" class="scanline"/>
    <line x1="20" y1="266" x2="780" y2="266" class="scanline"/>
    <line x1="20" y1="270" x2="780" y2="270" class="scanline"/>
    <line x1="20" y1="274" x2="780" y2="274" class="scanline"/>
    <line x1="20" y1="278" x2="780" y2="278" class="scanline"/>
    <line x1="20" y1="282" x2="780" y2="282" class="scanline"/>
    <line x1="20" y1="286" x2="780" y2="286" class="scanline"/>
    <line x1="20" y1="290" x2="780" y2="290" class="scanline"/>
