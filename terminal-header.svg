    <line x1="20" y1="318" x2="780" y2="318" class="scanline"/>
    <line x1="20" y1="322" x2="780" y2="322" class="scanline"/>
    <line x1="20" y1="326" x2="780" y2="326" class="scanline"/>
    <line x1="20" y1="330" x2="780" y2="330" class="scanline"/>
    <line x1="20" y1="334" x2="780" y2="334" class="scanline"/>
    <line x1="20" y1="338" x2="780" y2="338" class="scanline"/>
    <line x1="20" y1="342" x2="780" y2="342" class="scanline"/>
    <line x1="20" y1="346" x2="780" y2="346" class="scanline"/>
    <line x1="20" y1="350" x2="780" y2="350" class="scanline"/>
    <line x1="20" y1="354" x2="780" y2="354" class="scanline"/>
    <line x1="20" y1="358" x2="780" y2="358" class="scanline"/>
    <line x1="20" y1="362" x2="780" y2="362" class="scanline"/>
    <line x1="20" y1="366" x2="780" y2="366" class="scanline"/>
    <line x1="20" y1="370" x2="780" y2="370" class="scanline"/>
    <line x1="20" y1="374" x2="780" y2="374" class="scanline"/>
    <line x1="20" y1="378" x2="780" y2="378" class="scanline"/>
  </g>

  <!-- Terminal content with staggered fadeIn -->
  <g filter="url(#textglow)" class="screen-flicker">

    <!-- Boot line -->
    <text x="40" y="76" class="output-dim" style="animation: fadeIn 0.3s 0.1s both;">
      SYSTEM BOOT · kernel 6.1.0-station7 · encryption AES-256-GCM
    </text>

    <!-- Separator -->
    <text x="40" y="94" class="output-dim" style="animation: fadeIn 0.3s 0.4s both;">
      ──────────────────────────────────────────────────────────────────────
    </text>

    <!-- whoami command -->
    <text x="40" y="114" style="animation: fadeIn 0.3s 0.7s both;">
      <tspan class="prompt">webstyr@station-7</tspan>
      <tspan class="output-dim">:</tspan>
      <tspan class="output-warn">~</tspan>
      <tspan class="output-dim">$</tspan>
      <tspan class="cmd"> whoami --verbose</tspan>
    </text>

    <!-- Output rows -->
    <text x="40" y="134" style="animation: fadeIn 0.3s 1.0s both;">
      <tspan class="output-dim">  ├─ </tspan><tspan class="output-key">name       </tspan><tspan class="output-val">Achilles Wasonga</tspan>
    </text>
    <text x="40" y="152" style="animation: fadeIn 0.3s 1.2s both;">
      <tspan class="output-dim">  ├─ </tspan><tspan class="output-key">alias      </tspan><tspan class="output-val">webstyr</tspan>
    </text>
    <text x="40" y="170" style="animation: fadeIn 0.3s 1.4s both;">
      <tspan class="output-dim">  ├─ </tspan><tspan class="output-key">role       </tspan><tspan class="output-val">Security Engineer · Caid Technologies (NYC)</tspan>
    </text>
    <text x="40" y="188" style="animation: fadeIn 0.3s 1.6s both;">
      <tspan class="output-dim">  ├─ </tspan><tspan class="output-key">origin     </tspan><tspan class="output-val">Nairobi  →  Princeton  →  New York</tspan>
    </text>
    <text x="40" y="206" style="animation: fadeIn 0.3s 1.8s both;">
      <tspan class="output-dim">  ├─ </tspan><tspan class="output-key">build      </tspan><tspan class="output-val">Princeton CS · full-stack · cloud security · AR</tspan>
    </text>
    <text x="40" y="224" style="animation: fadeIn 0.3s 2.0s both;">
      <tspan class="output-dim">  └─ </tspan><tspan class="output-key">focus      </tspan><tspan class="output-val">offensive security · LLM eval · CAD/AI tooling</tspan>
    </text>

    <!-- Separator -->
    <text x="40" y="244" class="output-dim" style="animation: fadeIn 0.3s 2.2s both;">
      ──────────────────────────────────────────────────────────────────────
    </text>

    <!-- scan command -->
    <text x="40" y="264" style="animation: fadeIn 0.3s 2.4s both;">
      <tspan class="prompt">webstyr@station-7</tspan>
      <tspan class="output-dim">:</tspan>
      <tspan class="output-warn">~</tspan>
      <tspan class="output-dim">$</tspan>
      <tspan class="cmd"> nmap -sV --script vuln localhost</tspan>
    </text>

    <text x="40" y="282" style="animation: fadeIn 0.3s 2.7s both;">
      <tspan class="output-dim">  [</tspan><tspan class="output-green">SCAN</tspan><tspan class="output-dim">]  </tspan><tspan class="output-val">Target: localhost · Ports: 22,80,443,8080</tspan>
    </text>
    <text x="40" y="300" style="animation: fadeIn 0.3s 2.9s both;">
      <tspan class="output-dim">  [</tspan><tspan class="output-green">INFO</tspan><tspan class="output-dim">]  </tspan><tspan class="output-val">CloudMap v2.1 · AWS/GCP/Azure scanner · ACTIVE</tspan>
    </text>
    <text x="40" y="318" style="animation: fadeIn 0.3s 3.1s both;">
      <tspan class="output-dim">  [</tspan><tspan class="output-warn">WARN</tspan><tspan class="output-dim">]  </tspan><tspan class="output-val">Unauthorized access attempts will be logged.</tspan>
    </text>

    <!-- Separator -->
    <text x="40" y="338" class="output-dim" style="animation: fadeIn 0.3s 3.3s both;">
      ──────────────────────────────────────────────────────────────────────
    </text>

    <!-- Final prompt with cursor -->
    <text x="40" y="358" style="animation: fadeIn 0.3s 3.5s both;">
      <tspan class="prompt">webstyr@station-7</tspan>
      <tspan class="output-dim">:</tspan>
      <tspan class="output-warn">~</tspan>
      <tspan class="output-dim">$</tspan>
      <tspan class="cmd"> </tspan>
    </text>
    <rect x="198" y="345" width="8" height="14" class="cursor" style="animation-delay: 3.5s;"/>

  </g>

  <!-- CRT vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000008" stop-opacity="0.7"/>
  </radialGradient>
  <rect x="20" y="44" width="760" height="336" rx="4" fill="url(#vignette)"/>

  <!-- Screen border glow -->
  <rect x="20" y="44" width="760" height="336" rx="4" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3" filter="url(#glow)"/>
</svg>
