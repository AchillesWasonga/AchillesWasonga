<svg width="960" height="564" viewBox="0 0 960 564" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes flicker {
        0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
        20%,24%,55% { opacity: 0.4; }
      }
      .terminal-bg   { fill: #050810; }
      .title-bar     { fill: #0d1b2a; }
      .dot-red       { fill: #ff5f57; }
      .dot-yellow    { fill: #ffbd2e; }
      .dot-green     { fill: #28c840; }
      .prompt        { fill: #00d4ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .cmd           { fill: #e0f4ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
      .output-key    { fill: #7ad9ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-val    { fill: #c8f0ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-dim    { fill: #3a6a8a; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-warn   { fill: #ff6b35; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .output-green  { fill: #39ff14; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .typed         { fill: #e0f4ff; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .cursor        { fill: #00d4ff; animation: blink 1s step-end infinite; }
      .screen-flicker { animation: flicker 12s infinite; }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050e1a"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>

    <!-- One tile beats a hundred <line> elements. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#7ad9ff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Outer shell -->
  <rect width="960" height="564" rx="10" class="terminal-bg"/>
  <rect x="1" y="1" width="958" height="562" rx="10" fill="none" stroke="#0d2a40" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="44" rx="10" class="title-bar"/>
  <rect x="0" y="24" width="960" height="20" class="title-bar"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="22" r="7" class="dot-red"/>
  <circle cx="52" cy="22" r="7" class="dot-yellow"/>
  <circle cx="76" cy="22" r="7" class="dot-green"/>

  <!-- Title -->
  <text x="480" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3a6a8a">webstyr@station-7 — ssh — 120×34</text>

  <!-- Screen -->
  <rect x="20" y="44" width="920" height="500" rx="4" fill="url(#screenGrad)"/>
  <rect x="20" y="44" width="920" height="500" rx="4" fill="url(#scanlines)"/>

  <!-- Terminal content with staggered fadeIn -->
  <g filter="url(#textglow)" class="screen-flicker">

    <!-- ── First-time connection ────────────────────────────────────────── -->
    <text x="40" y="78" xml:space="preserve" style="animation: fadeIn 0.3s 0.2s both;"><tspan class="prompt">webstyr@station-7</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> ssh webstyr@203.0.113.47</tspan></text>

    <text x="40" y="100" xml:space="preserve" style="animation: fadeIn 0.3s 0.9s both;"><tspan class="output-val">The authenticity of host '203.0.113.47 (203.0.113.47)' can't be established.</tspan></text>
    <text x="40" y="118" xml:space="preserve" style="animation: fadeIn 0.3s 1.1s both;"><tspan class="output-val">ED25519 key fingerprint is </tspan><tspan class="output-key">SHA256:2D8kI0jdjIWlU/Xg2IAlX3KPibHx1nncfB7AgeTcHmA</tspan><tspan class="output-val">.</tspan></text>
    <text x="40" y="136" xml:space="preserve" style="animation: fadeIn 0.3s 1.3s both;"><tspan class="output-val">This key is not known by any other names.</tspan></text>
    <!-- Pasting the fingerprint is the [fingerprint] branch of the prompt: ssh
         compares it itself, so the human never eyeballs base64. -->
    <text x="40" y="154" xml:space="preserve" style="animation: fadeIn 0.3s 1.5s both;"><tspan class="output-val">Are you sure you want to continue connecting (yes/no/[fingerprint])? </tspan><tspan class="typed">SHA256:2D8kI0jdjIWlU/Xg2IAlX3KPibHx1nncfB7AgeTcHmA</tspan></text>
    <text x="40" y="172" xml:space="preserve" style="animation: fadeIn 0.3s 2.1s both;"><tspan class="output-warn">Warning: </tspan><tspan class="output-val">Permanently added '203.0.113.47' (ED25519) to the list of known hosts.</tspan></text>

    <text x="40" y="194" xml:space="preserve" style="animation: fadeIn 0.3s 2.4s both;"><tspan class="output-val">webstyr@203.0.113.47's password:</tspan></text>

    <text x="40" y="218" xml:space="preserve" style="animation: fadeIn 0.3s 3.0s both;"><tspan class="output-green">Welcome to Kali GNU/Linux Rolling</tspan></text>
    <text x="40" y="236" xml:space="preserve" style="animation: fadeIn 0.3s 3.2s both;"><tspan class="output-dim">Last login: Sun Aug  3 09:12:44 2026 from 198.51.100.9</tspan></text>

    <!-- ── Session ──────────────────────────────────────────────────────── -->
    <text x="40" y="262" xml:space="preserve" style="animation: fadeIn 0.3s 3.6s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> id</tspan></text>
    <text x="40" y="280" xml:space="preserve" style="animation: fadeIn 0.3s 3.8s both;"><tspan class="output-val">uid=1000(webstyr) gid=1000(webstyr) groups=1000(webstyr),4(adm),27(sudo)</tspan></text>

    <text x="40" y="304" xml:space="preserve" style="animation: fadeIn 0.3s 4.1s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> uname -srm</tspan></text>
    <text x="40" y="322" xml:space="preserve" style="animation: fadeIn 0.3s 4.3s both;"><tspan class="output-val">Linux 6.12.38-amd64 x86_64</tspan></text>

    <text x="40" y="346" xml:space="preserve" style="animation: fadeIn 0.3s 4.6s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> uptime</tspan></text>
    <text x="40" y="364" xml:space="preserve" style="animation: fadeIn 0.3s 4.8s both;"><tspan class="output-val"> 09:13:02 up 4 days,  2:11,  1 user,  load average: 0.08, 0.12, 0.09</tspan></text>

    <text x="40" y="388" xml:space="preserve" style="animation: fadeIn 0.3s 5.1s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> ls</tspan></text>
    <text x="40" y="406" xml:space="preserve" style="animation: fadeIn 0.3s 5.3s both;"><tspan class="output-key">cloudmap  notes  recon  tools  wordlists</tspan></text>

    <text x="40" y="430" xml:space="preserve" style="animation: fadeIn 0.3s 5.6s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> cd cloudmap</tspan></text>

    <text x="40" y="454" xml:space="preserve" style="animation: fadeIn 0.3s 5.9s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~/cloudmap</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> ./cloudmap scan --provider aws --region us-east-1</tspan></text>
    <text x="40" y="472" xml:space="preserve" style="animation: fadeIn 0.3s 6.2s both;"><tspan class="output-dim">[*] </tspan><tspan class="output-val">enumerating s3, iam, ec2 · region us-east-1</tspan></text>
    <text x="40" y="490" xml:space="preserve" style="animation: fadeIn 0.3s 6.4s both;"><tspan class="output-green">[+] </tspan><tspan class="output-val">42 resources checked · 3 findings</tspan></text>
    <text x="40" y="508" xml:space="preserve" style="animation: fadeIn 0.3s 6.6s both;"><tspan class="output-warn">[!] </tspan><tspan class="output-val">s3://acme-artifacts · public read ACL · HIGH</tspan></text>

    <text x="40" y="532" xml:space="preserve" style="animation: fadeIn 0.3s 6.8s both;"><tspan class="prompt">webstyr@kali</tspan><tspan class="output-dim">:</tspan><tspan class="output-warn">~/cloudmap</tspan><tspan class="output-dim">$</tspan><tspan class="cmd"> </tspan></text>
    <rect x="235" y="519" width="8" height="14" class="cursor" style="animation-delay: 6.8s;"/>

  </g>

  <!-- CRT vignette + border glow -->
  <rect x="20" y="44" width="920" height="500" rx="4" fill="url(#vignette)"/>
  <rect x="20" y="44" width="920" height="500" rx="4" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3" filter="url(#glow)"/>
</svg>
