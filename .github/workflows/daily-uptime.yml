name: Daily Uptime Monitor

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check site uptime
        run: python3 scripts/check_uptime.py

      - uses: ./.github/actions/commit-push
        with:
          files: logs/uptime.md logs/uptime-history.md
          message: "chore(uptime): daily check ${{ steps.meta.outputs.date }}"
