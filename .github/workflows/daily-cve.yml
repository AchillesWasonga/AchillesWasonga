name: Daily CVE Feed

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  fetch-cves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CVEs
        run: python3 scripts/fetch_cves.py

      - name: Commit and push
        run: |
          git config user.name "webstyr-bot"
          git config user.email "achwasonga@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add logs/cve-feed.md
          git diff --staged --quiet || git commit -m "chore(cve): daily feed update $(date -u +%Y-%m-%d)"
          git push
