name: Daily CVE Feed

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch CVEs
        run: python3 scripts/fetch_cves.py

      - uses: ./.github/actions/commit-push
        with:
          files: logs/cve-feed.md
          message: "chore(cve): daily feed update ${{ steps.meta.outputs.date }}"
