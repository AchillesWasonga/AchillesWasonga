name: Daily Security Research

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch security research
        run: python3 scripts/fetch_research.py

      - uses: ./.github/actions/commit-push
        with:
          files: logs/research.md
          message: "chore(research): daily security digest ${{ steps.meta.outputs.date }}"
