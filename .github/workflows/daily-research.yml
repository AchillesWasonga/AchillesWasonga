name: Daily Security Research

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  fetch-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch security research
        run: python3 scripts/fetch_research.py

      - name: Commit and push
        run: |
          git config user.name "webstyr-bot"
          git config user.email "achwasonga@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add logs/research.md
          git diff --staged --quiet || git commit -m "chore(research): daily security digest $(date -u +%Y-%m-%d)"
          git push
