name: Daily Platform Stats

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch platform stats
        run: python3 scripts/fetch_stats.py

      - name: Commit and push
        run: |
          git config user.name "webstyr-bot"
          git config user.email "achwasonga@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add logs/platform-stats.md
          git diff --staged --quiet || git commit -m "chore(stats): daily platform update $(date -u +%Y-%m-%d)"
          git push
