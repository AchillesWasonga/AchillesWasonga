name: Daily Platform Stats

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch platform stats
        run: python3 scripts/fetch_stats.py

      - uses: ./.github/actions/commit-push
        with:
          files: logs/platform-stats.md
          message: "chore(stats): daily platform update ${{ steps.meta.outputs.date }}"
