name: Daily CTF Challenge

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-ctf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch CTF challenge
        run: python3 scripts/fetch_ctf.py

      - uses: ./.github/actions/commit-push
        with:
          files: logs/ctf-challenge.md
          message: "chore(ctf): daily challenge update ${{ steps.meta.outputs.date }}"
