name: Daily CTF Challenge

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  fetch-ctf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CTF challenge
        run: python3 scripts/fetch_ctf.py

      - name: Commit and push
        run: |
          git config user.name "webstyr-bot"
          git config user.email "achwasonga@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add logs/ctf-challenge.md
          git diff --staged --quiet || git commit -m "chore(ctf): daily challenge update $(date -u +%Y-%m-%d)"
          git push
